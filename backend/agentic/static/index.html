<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talk2Book Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        primary: '#0ea5e9', // Sky 500
                        secondary: '#38bdf8', // Sky 400
                        accent: '#6366f1', // Indigo 500
                    },
                    animation: {
                        'blob': 'blob 7s infinite',
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
        }

        .mic-active {
            box-shadow: 0 0 0 0 rgba(14, 165, 233, 0.7);
            animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        @keyframes pulse-ring {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(14, 165, 233, 0.7);
            }

            70% {
                transform: scale(1);
                box-shadow: 0 0 0 20px rgba(14, 165, 233, 0);
            }

            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(14, 165, 233, 0);
            }
        }

        .visualizer-bar {
            transition: height 0.05s ease;
            border-radius: 9999px;
        }
    </style>
</head>

<body
    class="bg-indigo-50 min-h-screen flex flex-col items-center justify-center relative overflow-hidden selection:bg-pink-300 selection:text-pink-900">

    <!-- Ambient Background -->
    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10">
        <div
            class="absolute top-0 left-1/4 w-96 h-96 bg-blue-300 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob">
        </div>
        <div
            class="absolute top-0 right-1/4 w-96 h-96 bg-purple-300 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob animation-delay-2000">
        </div>
        <div
            class="absolute -bottom-8 left-1/3 w-96 h-96 bg-pink-300 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob animation-delay-4000">
        </div>
    </div>

    <!-- Main Interface -->
    <main class="w-full max-w-lg px-6">
        <div class="glass-panel rounded-[2rem] p-10 text-center relative">

            <!-- Header -->
            <div class="mb-8">
                <div
                    class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-blue-100/50 mb-4 text-primary">
                    <i class="fas fa-robot text-xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-800 tracking-tight">Talk2Book Assistant</h1>
                <div class="flex items-center justify-center space-x-2 mt-2">
                    <div id="connection-dot" class="w-2 h-2 rounded-full bg-yellow-400"></div>
                    <p class="text-slate-500 text-sm font-medium" id="status-text">Connecting...</p>
                </div>
            </div>

            <!-- Visualization Area -->
            <div class="h-24 flex items-center justify-center space-x-1.5 mb-12" id="visualizer">
                <!-- Bars will be generated by JS -->
            </div>

            <!-- Interaction Area -->
            <div class="relative group flex justify-center">
                <button id="mic-btn"
                    class="w-24 h-24 rounded-full bg-gradient-to-tr from-sky-400 to-indigo-500 text-white shadow-lg shadow-sky-200 flex items-center justify-center transition-all duration-300 transform hover:scale-105 active:scale-95 disabled:opacity-50 disabled:grayscale disabled:cursor-not-allowed">
                    <i class="fas fa-microphone text-3xl drop-shadow-md"></i>
                </button>
            </div>

            <p class="mt-8 text-slate-400 text-xs font-semibold uppercase tracking-widest" id="hint-text">Hold to Speak
            </p>
        </div>

        <p class="text-center text-slate-400 text-xs mt-6 font-medium">Powered by WebRTC & OpenAI</p>
    </main>

    <script>
        const micBtn = document.getElementById('mic-btn');
        const statusText = document.getElementById('status-text');
        const connectionDot = document.getElementById('connection-dot');
        const visualizer = document.getElementById('visualizer');
        const hintText = document.getElementById('hint-text');

        let pc = null;
        let localStream = null;
        let audioContext = null;
        let analyser = null;
        let dataArray = null;
        let animationId = null;
        let isAiSpeaking = false;

        // Debug/State flags
        let isHolding = false;

        // --- Visualizer Setup ---
        const numBars = 20;
        visualizer.innerHTML = '';
        for (let i = 0; i < numBars; i++) {
            const bar = document.createElement('div');
            bar.className = 'w-1.5 bg-slate-300 visualizer-bar h-1';
            visualizer.appendChild(bar);
        }
        const bars = document.querySelectorAll('.visualizer-bar');

        function setStatus(status, type) {
            statusText.innerText = status;
            if (type === 'connected') {
                connectionDot.className = 'w-2 h-2 rounded-full bg-emerald-400 shadow-[0_0_10px_rgba(52,211,153,0.5)]';
                micBtn.disabled = false;
            } else if (type === 'error') {
                connectionDot.className = 'w-2 h-2 rounded-full bg-red-500';
                micBtn.disabled = true;
            } else if (type === 'connecting') {
                connectionDot.className = 'w-2 h-2 rounded-full bg-yellow-400 animate-pulse';
                micBtn.disabled = true;
            }
        }

        async function init() {
            setStatus("Requesting Mic Access...", "connecting");
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true,
                        channelCount: 1
                    }
                });

                // Start Muted
                localStream.getAudioTracks()[0].enabled = false;

                startWebRTC();

            } catch (err) {
                console.error(err);
                setStatus("Microphone Permission Denied", "error");
            }
        }

        async function startWebRTC() {
            setStatus("Connecting to Server...", "connecting");

            try {
                pc = new RTCPeerConnection();

                // Add Local Track
                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

                // Handle Remote Track (AI Audio)
                pc.ontrack = (event) => {
                    console.log("Remote track received");
                    const el = document.createElement('audio');
                    el.srcObject = event.streams[0];
                    el.autoplay = true;
                    el.controls = false;
                    document.body.appendChild(el);

                    // Hook up visualizer to the INCOMING stream (to see AI talking)
                    // Or MIX both? Usually visualizer shows whoever is active.
                    // Let's visualize the remote stream for "AI Speaking" and local for "User Speaking".
                    // For simplicity, we'll swap the source dynamically or mix them. 
                    // Actually, simpler: Visualize AI when AI speaks, Visualize Mic when User holds button.

                    setupAudioAnalysis(event.streams[0]);
                };

                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);

                const response = await fetch('/offer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sdp: pc.localDescription.sdp,
                        type: pc.localDescription.type
                    })
                });

                if (!response.ok) throw new Error("Server Error");

                const answer = await response.json();
                await pc.setRemoteDescription(answer);

                setStatus("Ready", "connected");

            } catch (err) {
                console.error(err);
                setStatus("Connection Failed. Retrying...", "error");
                setTimeout(startWebRTC, 3000);
            }
        }

        let mediaStreamSource = null;

        function setupAudioAnalysis(remoteStream) {
            if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();

            // Create analyser
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 64;
            analyser.smoothingTimeConstant = 0.8;

            // Connect Remote Stream to Analyser
            const remoteSource = audioContext.createMediaStreamSource(remoteStream);
            remoteSource.connect(analyser);

            // We also want to hear it! (Browser usually handles the <audio> tag for hearing, 
            // but if we process it with Web Audio API, we might need to connect to destination)
            // remoteSource.connect(audioContext.destination); 
            // Note: The <audio> element is already playing it, so connecting to destination might cause echo if not careful.
            // Since we created MediaStreamSource from the stream used in <audio>, it's fine.

            dataArray = new Uint8Array(analyser.frequencyBinCount);
            drawVisualizer();
        }

        function drawVisualizer() {
            requestAnimationFrame(drawVisualizer);
            if (!analyser) return;

            analyser.getByteFrequencyData(dataArray);

            // Calculate Volume for VAD Logic
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) {
                sum += dataArray[i];
            }
            const average = sum / dataArray.length;

            // AI Speaking State Logic
            if (average > 10) {
                if (!isAiSpeaking) {
                    isAiSpeaking = true;
                    micBtn.disabled = true;
                    // hintText.innerText = "Listening to AI...";
                    setStatus("AI is speaking...", "connected");

                    // Visual changes
                    bars.forEach(b => b.classList.remove('bg-slate-300'));
                }
            } else {
                if (isAiSpeaking && average < 5) {
                    // Release delay
                    setTimeout(() => {
                        if (average < 5 && isAiSpeaking) {
                            isAiSpeaking = false;

                            if (isHolding) {
                                // Rare case: user held button while AI was finishing?
                                // Usually we disabled button, so isHolding should be false.
                            } else {
                                micBtn.disabled = false;
                                setStatus("Ready", "connected");
                                hintText.innerText = "Hold to Speak";
                                // Reset bars color
                                bars.forEach(b => b.classList.add('bg-slate-300'));
                            }
                        }
                    }, 500);
                }
            }

            // Update Bars UI
            bars.forEach((bar, index) => {
                // Ensure index checks
                const value = dataArray[index % dataArray.length] || 0;

                // If AI is speaking or User is speaking (we can visualize Mic too if we want)
                // Currently setting up analyzer on REMOTE stream only.

                let height = Math.max(0.25, value / 5);

                // If User is holding button, we might want to fake visualization or connect local mic to analyzer
                // For now, let's keep it responding to AI voice (Remote)

                if (isHolding) {
                    // Fake visualization for User voice if we don't hook up local analyzer
                    height = Math.random() * 2 + 0.5;
                }

                bar.style.height = `${height}rem`;

                if (isAiSpeaking) {
                    bar.style.backgroundColor = '#6366f1'; // Indigo
                } else if (isHolding) {
                    bar.style.backgroundColor = '#0ea5e9'; // Sky
                } else {
                    bar.style.height = '0.25rem';
                    bar.style.backgroundColor = '#cbd5e1'; // Slate 300
                }
            });
        }

        // --- Interaction Logic ---

        const startTalking = () => {
            if (isAiSpeaking || !localStream || micBtn.disabled) return;
            isHolding = true;
            localStream.getAudioTracks()[0].enabled = true;

            micBtn.classList.add('mic-active');
            setStatus("Listening...", "connected");

            // Optionally: Resume Audio Context if suspended (browser requirement)
            if (audioContext && audioContext.state === 'suspended') {
                audioContext.resume();
            }
        };

        const stopTalking = () => {
            if (!isHolding) return;
            isHolding = false;

            if (localStream) {
                localStream.getAudioTracks()[0].enabled = false;
            }

            micBtn.classList.remove('mic-active');

            if (!isAiSpeaking) {
                setStatus("Processing...", "connected");
            }
        };

        micBtn.addEventListener('mousedown', startTalking);
        window.addEventListener('mouseup', stopTalking);
        micBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startTalking(); });
        window.addEventListener('touchend', stopTalking);

        // Start
        init();

    </script>
</body>

</html>
