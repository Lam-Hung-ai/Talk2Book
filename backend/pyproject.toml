[project]
name = "backend"
version = "0.1.0"
description = "this is an backend for project Talk2Book"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.13.2",
    "aiortc>=1.14.0",
    "asyncpg>=0.30.0",
    "bcrypt>=5.0.0",
    "fastapi-mcp>=0.4.0",
    "fastapi[standard]>=0.121.0",
    "langchain>=1.1.2",
    "langchain-mcp-adapters>=0.1.14",
    "langchain-openai>=1.1.0",
    "numpy>=2.3.5",
    "pydantic-settings>=2.11.0",
    "pyjwt>=2.10.1",
    "python-socketio>=5.15.0",
    "redis>=7.1.0",
    "scipy>=1.16.3",
    "sounddevice>=0.5.3",
    "soundfile>=0.13.1",
    "sqlmodel>=0.0.27",
]

[dependency-groups]
dev = [
    "ruff>=0.14.4",
]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-include = ["*.ipynb"]
fix = true
unsafe-fixes = false

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "C",
    "I",
    "UP",
]

ignore = [
    "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

